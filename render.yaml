# =========================================================
# Render Blueprint — Disaster Management System
#
# Provisions two resources in one click:
#   1) disaster-api      — Spring Boot backend (Docker)
#   2) disaster-frontend — React/Vite SPA (Static Site)
#
# The database is NOT provisioned here. Render's managed databases are
# PostgreSQL only, and this app is MySQL-specific (mysql-connector-j,
# MySQLDialect, and db/*.sql use AUTO_INCREMENT / ENUM / ENGINE=InnoDB /
# DELIMITER). So MySQL has to be hosted elsewhere — any provider with a
# free tier works (Aiven, Railway, Clever Cloud, PlanetScale, ...).
# Its connection details are supplied as secrets, see below.
#
# Deploy:
#   1. Push this file to your GitHub repo (default branch).
#   2. Create the MySQL database with your provider and load the schema
#      (all four files — see docs/DEPLOY.md).
#   3. In Render:  New  ->  Blueprint  ->  pick the repo.
#   4. Render prompts for every `sync: false` var during creation.
# =========================================================

services:
  # ---- Backend: Spring Boot on Docker -------------------------
  - type: web
    name: disaster-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"

      # --- External MySQL. Render prompts for these on Blueprint create. ---
      # Example URL:
      #   jdbc:mysql://HOST:PORT/disaster_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # --- Auth. Generate with: openssl rand -base64 64 ---
      - key: SECURITY_JWT_SECRET
        sync: false
      - key: SECURITY_JWT_EXPIRATION_MS
        value: "86400000"

      # --- CORS. Comma-separated. Must list the exact origin the SPA is
      #     served from — the Render static site below, or the Vercel URL
      #     if you deploy the frontend there instead (see vercel.json). ---
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  # ---- Frontend: React/Vite Static Site ----------------------
  - type: web
    name: disaster-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback: without this, a hard refresh on a client-side route
    # (e.g. /camps) 404s. Replaces the deleted frontend/public/_redirects.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://disaster-api.onrender.com/api
