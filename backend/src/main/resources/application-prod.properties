# =========================================================
# Production overrides. Active when SPRING_PROFILES_ACTIVE=prod,
# which render.yaml sets on the disaster-api service.
#
# These deliberately have NO defaults. application.properties carries
# development fallbacks — including a JWT signing key that is committed
# to this repo and therefore public. If a deployment were to start with
# that key, anyone could mint a valid admin token. Failing to start on a
# missing variable is the safer outcome, so every value below is required.
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

security.jwt.secret=${SECURITY_JWT_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
