# =========================================================
# Disaster Management API configuration
# Edit the datasource block to match your local MySQL setup.
# =========================================================

spring.application.name=disaster-management

# --- Datasource (MySQL) -----------------------------------
# Local credentials are baked in for development; on Render the URL is
# assembled from SPRING_DATASOURCE_HOST/PORT/DB defined in render.yaml,
# so a stale SPRING_DATASOURCE_URL in the Render dashboard can't hijack
# the connection.
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_DB:disaster_db}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:415139}

# --- JPA / Hibernate --------------------------------------
# We manage schema and triggers via the SQL files in /db,
# so ddl-auto is set to "none" to avoid Hibernate fighting
# with our hand-written DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Server -----------------------------------------------
# Render sets $PORT automatically; we honor it when present.
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# --- Auth (JWT, HS256) -----------------------------------
# Local secret is 64 random bytes (base64-encoded). It is suitable for
# local development only — override SECURITY_JWT_SECRET on Render.
security.jwt.secret=${SECURITY_JWT_SECRET:ZmFjYWQ4OWJlYjU4OWM5YjRiOTg5M2Q5M2E2M2NkMzE0N2YyYjdlYjQ5OGY0YjczZTk2OTRiZGEyN2M2M2NhYw==}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:86400000}

# --- CORS -------------------------------------------------
# Comma-separated list of allowed origins for the SPA.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
